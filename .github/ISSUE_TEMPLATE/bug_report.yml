name: "Сообщить об ошибке"
description: "Сообщение с шагами воспроизведения ошибки NYVERRA"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте приватные сохранения, токены и персональные данные. Уязвимости сообщайте по SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: "Что произошло?"
      description: "Краткое описание ошибки"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения"
      placeholder: "1. Открыть карту...\n2. Запустить...\n3. Нажать..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемое поведение"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: "Версия / коммит"
      placeholder: "Alpha 0.61 / SHA"
  - type: dropdown
    id: runmode
    attributes:
      label: "Режим запуска"
      options:
        - "Unreal Editor (PIE)"
        - "Standalone"
        - "Dedicated Server"
        - "Сборка Windows"
        - "Только исходники / скрипты"
  - type: textarea
    id: logs
    attributes:
      label: "Логи и скриншоты"
      description: "Только очищенные от секретов и идентификаторов"
