name: NYVERRA offline source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q Tools
      - name: Full Python/Unreal source regression suite (through Alpha 0.61)
        run: python -m unittest discover -s Tools -p "test_alpha_*.py" -v
