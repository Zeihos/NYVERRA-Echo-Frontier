<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">NYVERRA: Echo Frontier</title>
<desc id="desc">Концептуальная обложка проекта: светящаяся монограмма N, горный горизонт и название NYVERRA на тёмном фоне. Не является скриншотом игры.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#080F1B"/>
   <stop offset=".46" stop-color="#142332"/>
   <stop offset="1" stop-color="#07111D"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#D8F7F1"/>
   <stop offset=".46" stop-color="#6CDBC9"/>
   <stop offset="1" stop-color="#369DAB"/>
 </linearGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#203D49"/>
   <stop offset="1" stop-color="#08131F"/>
 </linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#1C3440" stop-opacity=".95"/>
   <stop offset="1" stop-color="#0A1522" stop-opacity=".9"/>
 </linearGradient>
 <radialGradient id="light" cx="62%" cy="32%" r="60%">
   <stop stop-color="#59F2C9" stop-opacity=".14"/>
   <stop offset="1" stop-color="#59F2C9" stop-opacity="0"/>
 </radialGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
